name: "Simple Screenshot Test"
description: "Test screenshot comparison with 2 URLs"
baseUrl: "https://example.com"

execution:
  mode: "construct"
  concurrent: 1
  iterations: 2

parameters:
  - name: "page"
    type: "array"
    values: ["", "about"]

comparison:
  enabled: true
  type: "screenshot"
  baseUrl2: "https://example.org"
  threshold: 0.1
  screenshot:
    viewport:
      width: 800
      height: 600
    waitUntil: "load"
    timeout: 30000

k6Options:
  thresholds:
    http_req_duration: ["p(95)<5000"]
