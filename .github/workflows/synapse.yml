name: Synapse CI

on:
  workflow_call:
    inputs:
      config:
        description: Path to synapse.yml
        required: false
        default: synapse.yml
        type: string
      compare:
        description: Run comparison after load test
        required: false
        default: false
        type: boolean
      fail_on_diff:
        description: Fail the job when comparisons miss thresholds
        required: false
        default: true
        type: boolean
      dry_run:
        description: Generate K6 script only
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      config:
        description: Path to synapse.yml
        required: false
        default: synapse.yml
        type: string
      compare:
        description: Run comparison after load test
        required: false
        default: false
        type: boolean
      fail_on_diff:
        description: Fail the job when comparisons miss thresholds
        required: false
        default: true
        type: boolean

jobs:
  synapse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Install Synapse
        run: npm install -g synapse-surge

      - name: Doctor
        run: synapse doctor

      - name: Validate config
        run: synapse validate --config "${{ inputs.config || 'synapse.yml' }}"

      - name: Run Synapse
        run: |
          ARGS=(run --config "${{ inputs.config || 'synapse.yml' }}" --output ./synapse-output --keep-script)
          if [[ "${{ inputs.compare }}" == "true" ]]; then
            ARGS+=(--compare --save-screenshots)
          fi
          if [[ "${{ inputs.fail_on_diff }}" == "true" ]]; then
            ARGS+=(--fail-on-diff)
          fi
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          synapse "${ARGS[@]}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-output
          path: synapse-output/
          if-no-files-found: ignore
